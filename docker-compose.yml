services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: masjid-abu-dzar:local
    container_name: masjid-pondok-app
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Selalu arahkan ke service `db`, bukan localhost dari .env.
      # Password diambil dari POSTGRES_PASSWORD agar konsisten dengan database.
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}@db:5432/masjid_abu_dzar?schema=public"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    container_name: masjid-pondok-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: masjid_abu_dzar
    ports:
      # Hanya bind ke localhost agar database tidak terbuka dari jaringan luar.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masjid_abu_dzar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
