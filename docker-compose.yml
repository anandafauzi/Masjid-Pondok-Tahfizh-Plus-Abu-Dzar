services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masjid-pondok-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/app/public:ro

  db:
    image: postgres:16-alpine
    container_name: masjid-pondok-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: masjid_abu_dzar
    ports:
      # Hanya bind ke localhost agar database tidak terbuka dari jaringan luar.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masjid_abu_dzar"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
