<!DOCTYPE html>
<html lang="id">
  <head>

    <link rel="manifest" href="/manifest.json" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b132b;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;

      .card { max-width: 420px; }
      .icon { font-size: 56px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #bfdbfe; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #10b981;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }

  <body>
    <div class="card">
      <div class="icon">🕌</div>
      <h1>Tidak Ada Koneksi</h1>

        Perangkat sedang offline. Halaman ini akan tersedia kembali setelah
