name: Database Backup

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client 17 (sesuai versi server Supabase)
        run: |
          # pg_dump hanya bisa membaca server dengan major version <= versinya.
          # Server Supabase sudah PostgreSQL 17, sedangkan paket default
          # ubuntu-latest masih 16 -> "server version mismatch".
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Backup database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_RETENTION: "7"
        run: |
          chmod +x scripts/backup-db.sh
          ./scripts/backup-db.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 7
          if-no-files-found: error
