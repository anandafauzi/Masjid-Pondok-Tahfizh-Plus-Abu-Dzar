name: Database Backup

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cek koneksi database & versi pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL belum diisi (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # pg_dump hanya bisa membaca server dengan major version <= versinya.
          # Server Supabase saat ini PostgreSQL 17, sedangkan paket default
          # runner hanya 16 -> "server version mismatch". Jadi pg_dump dijalankan
          # dari image resmi PostgreSQL 17 (versi selalu cocok, tanpa repot apt).
          docker run --rm postgres:17-alpine pg_dump --version
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            psql "$DATABASE_URL" -tAc "select version()"

      - name: Backup database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          TIMESTAMP="$(date -u +%Y%m%d_%H%M%S)"
          OUTFILE="backups/masjid_abu_dzar_${TIMESTAMP}.sql.gz"

          # pg_dump 17 dari image resmi, stdout dialirkan ke gzip di runner.
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --format=plain --no-owner --no-privileges' \
            | gzip -c > "$OUTFILE"

          if [ ! -s "$OUTFILE" ]; then
            echo "::error::File backup kosong, proses dibatalkan."
            exit 1
          fi

          echo "Ukuran backup: $(du -h "$OUTFILE" | cut -f1)"
          echo "File: $OUTFILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 7
          if-no-files-found: error
