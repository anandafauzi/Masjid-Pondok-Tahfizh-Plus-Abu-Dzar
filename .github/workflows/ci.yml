name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy URL cukup buat generate Prisma & build Next.js
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      NEXTAUTH_SECRET: "ci-dummy-secret-ci-dummy-secret-ci-dummy-secret"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
